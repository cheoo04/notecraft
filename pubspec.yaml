name: notecraft
description: "NoteCraft — transforme tes notes en documents structurés"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Réseau
  dio: ^5.5.0

  # Stockage / backend
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0
  firebase_auth: ^5.1.4
  firebase_storage: ^12.1.3

  # Audio
  record: ^7.1.1
  just_audio: ^0.9.40

  # Export PDF
  pdf: ^3.11.0
  printing: ^5.13.1

  # Base locale (accès hors-ligne à l'historique)
  path_provider: ^2.1.3
  gpt_markdown: ^1.2.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: False
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
